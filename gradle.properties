# Important Notes:
# Every field you add must be added to the expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=1.0.5
group=com.github.Jesper_Andersson
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Biome Pick'n'Choose
mod_author=Jesper-Andersson
mod_id=biomepicknchoose
license=CC0-1.0
credits=
description=Turn individual overworld biomes on and off, from vanilla and other mods.
minecraft_version_range=[1.21.1]
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric
fabric_version=0.116.7+1.21.1
fabric_loader_version=0.16.14
# Optional, compile only: adds the config button to the Mod Menu list
modmenu_version=11.0.3

# NeoForge
neoforge_version=21.1.251
neoforge_version_range=[21.1.0,)
neoforge_loader_version_range=[4,)

# Optional, compile only: the compat mixin wraps Lithostitched's biome injectors. Only applied when it is installed
lithostitched_version=1.8.0
lithostitched_version_range=[1.8.0,)
# Only for testing with Lithostitched, which needs it
apollib_version=1.2.0

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
