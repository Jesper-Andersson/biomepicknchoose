name: Publish

on:
  push:
    branches: [master]
    # Commits that don't change the mod itself don't make a release
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
  workflow_dispatch:

# Two runs at once would both bump to the same version. Later pushes wait, and only the newest waiting one runs,
# since it checks out the latest master anyway
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # The version bump commit is pushed with GITHUB_TOKEN, which doesn't trigger workflows, but guard against a loop anyway
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version commit and tag, create the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0   # full history and tags, for the changelog

      # Commit messages since the last release, leaving out merges, release commits and commits that only touch the
      # files the push trigger ignores
      - name: Changelog
        id: changelog
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          changes=$(git log --no-merges --format='- %s' ${previous:+$previous..}HEAD -- . ':!*.md' ':!.github' ':!.gitignore' | grep -v '^- Release ' || true)
          [ -n "$changes" ] || changes="- Maintenance release"
          {
            echo "text<<CHANGELOG_EOF"
            echo "$changes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changes since ${previous:-the first commit}:"
          echo "$changes"

      - name: Bump patch version
        id: version
        run: |
          current=$(grep '^version=' gradle.properties | cut -d= -f2)
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          sed -i "s/^version=.*/version=$next/" gradle.properties
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped $current -> $next"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      # Only after a successful build, so a broken build doesn't use up a version number
      - name: Commit and tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin master "v${{ steps.version.outputs.version }}"

      - name: Publish NeoForge to Modrinth and CurseForge
        id: publish-neoforge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          version: ${{ steps.version.outputs.version }}-neoforge
          name: Biome Pick'n'Choose ${{ steps.version.outputs.version }} (NeoForge)
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: neoforge

          modrinth-id: iQ3RruEb
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1724905
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar

      - name: Publish Fabric to Modrinth and CurseForge
        id: publish-fabric
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          version: ${{ steps.version.outputs.version }}-fabric
          name: Biome Pick'n'Choose ${{ steps.version.outputs.version }} (Fabric)
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: fabric

          modrinth-id: iQ3RruEb
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1724905
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar

      # Made here instead of by mc-publish, so the post can link to the files just uploaded to Modrinth and CurseForge
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGES: ${{ steps.changelog.outputs.text }}
          MODRINTH_NEOFORGE: ${{ steps.publish-neoforge.outputs.modrinth-version }}
          CURSEFORGE_NEOFORGE: ${{ steps.publish-neoforge.outputs.curseforge-version }}
          MODRINTH_FABRIC: ${{ steps.publish-fabric.outputs.modrinth-version }}
          CURSEFORGE_FABRIC: ${{ steps.publish-fabric.outputs.curseforge-version }}
        run: |
          shopt -s extglob nullglob
          # Both loaders' jars go in the one release, without the sources and javadoc jars
          jars=({neoforge,fabric}/build/libs/!(*-@(dev|sources|javadoc)).jar)
          if [ "${#jars[@]}" -ne 2 ]; then
            echo "Expected a NeoForge and a Fabric jar, found: ${jars[*]}"
            exit 1
          fi
          {
            echo "## Changes"
            echo
            echo "$CHANGES"
            echo
            echo "## Download"
            echo
            echo "- NeoForge: [Modrinth](https://modrinth.com/mod/biome-picknchoose/version/$MODRINTH_NEOFORGE), [CurseForge](https://www.curseforge.com/minecraft/mc-mods/biome-picknchoose/files/$CURSEFORGE_NEOFORGE)"
            echo "- Fabric: [Modrinth](https://modrinth.com/mod/biome-picknchoose/version/$MODRINTH_FABRIC), [CurseForge](https://www.curseforge.com/minecraft/mc-mods/biome-picknchoose/files/$CURSEFORGE_FABRIC)"
          } > release-notes.md
          gh release create "v$VERSION" "${jars[@]}" \
            --title "Biome Pick'n'Choose $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
