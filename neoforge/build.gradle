plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('forge.logging.markers', 'REGISTRIES')
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        smokeTest {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/smoketest')
            systemProperty('biomepicknchoose.smoketest', smokeTestBiome)
            disableIdeRun()
            taskBefore(tasks.named('prepareSmokeTest'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Dependencies for runtime testing only, not pulled by dependents of this mod
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional: the compat mixin wraps Lithostitched's biome injectors. Only applied when it is installed
    compileOnly "maven.modrinth:lithostitched:${lithostitched_version}-neoforge-${minecraft_version.substring(2)}"

    // Uncomment to test with Lithostitched (it needs Apollib, which its Modrinth metadata doesn't declare)
    // localRuntime "maven.modrinth:lithostitched:${lithostitched_version}-neoforge-${minecraft_version.substring(2)}"
    // localRuntime "maven.modrinth:apollib:${apollib_version}-neoforge-${minecraft_version.substring(2)}"
}
